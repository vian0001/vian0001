<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="200" fill="#0D1117" />

  <!-- Left accent line (asymmetric, not full-width) -->
  <rect x="48" y="0" width="200" height="2" fill="url(#accent)" />

  <!-- Name -->
  <text x="48" y="72" fill="#E6EDF3" class="sans" font-size="38" font-weight="700" letter-spacing="-0.025em">Jovian Ekasakta</text>

  <!-- Tagline -->
  <text x="48" y="104" fill="#7D8590" class="mono" font-size="14" letter-spacing="0.01em">builds networks, breaks things, ships code</text>

  <!-- Thin rule -->
  <line x1="48" y1="130" x2="360" y2="130" stroke="#21262D" stroke-width="1" />

  <!-- Location + context -->
  <text x="48" y="158" fill="#484F58" class="mono" font-size="12" letter-spacing="0.03em">jombang, east java · tkj · class of 2027</text>

  <!-- Status dot -->
  <circle cx="48" cy="182" r="3" fill="#3FB950" opacity="0.8" />
  <text x="60" y="186" fill="#484F58" class="mono" font-size="11">open to opportunities</text>
</svg>
