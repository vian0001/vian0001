<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#090E1A" />
      <stop offset="80%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <!-- Holographic Cyber Border -->
    <linearGradient id="hologramBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#34D399;#38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#38BDF8;#818CF8;#22C55E" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Amber Gold Gradient for Champion Badge -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Laser Scanner Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="matrixGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45" />
      <circle cx="36" cy="36" r="0.9" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes radarScan {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    
    @keyframes pulseBeacon {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 7px; opacity: 0.4; }
    }

    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes glitchFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.4; transform: skewX(-2deg); }
      94% { opacity: 1; transform: skewX(0deg); }
      98% { opacity: 0.7; }
    }

    .scanner-line { animation: radarScan 5s ease-in-out infinite; }
    .beacon { animation: pulseBeacon 2s infinite ease-in-out; }
    .glitch-text { animation: glitchFlicker 7s infinite; }
    .rotating-radar { transform-origin: 1090px 70px; animation: radarRotate 12s linear infinite; }
  </style>

  <!-- Outer Canvas Container -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="url(#bgCanvas)" />
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="url(#matrixGrid)" />
  <rect x="2" y="2" width="1196" height="416" rx="16" stroke="url(#hologramBorder)" stroke-width="1.6" />

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="190" r="140" fill="#0284C7" fill-opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="1020" cy="180" r="150" fill="#10B981" fill-opacity="0.09" filter="url(#cyanGlow)" />
  <circle cx="600" cy="210" r="110" fill="#6366F1" fill-opacity="0.08" filter="url(#cyanGlow)" />

  <!-- Moving Laser Scanner Overlay -->
  <g class="scanner-line">
    <line x1="20" y1="40" x2="1180" y2="40" stroke="url(#scanGrad)" stroke-width="2" />
    <circle cx="600" cy="40" r="3" fill="#38BDF8" filter="url(#cyanGlow)" />
  </g>

  <!-- Technical Corner Brackets -->
  <path d="M 16 44 L 16 16 L 44 16" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1184 44 L 1184 16 L 1156 16" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 376 L 16 404 L 44 404" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1184 376 L 1184 404 L 1156 404" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top SOC Operations Bar -->
  <rect x="20" y="18" width="1160" height="38" rx="8" fill="#090E17" stroke="#1E293B" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="44" cy="37" r="5" fill="#EF4444" />
  <circle cx="62" cy="37" r="5" fill="#F59E0B" />
  <circle cx="80" cy="37" r="5" fill="#10B981" />

  <!-- Session Monospace Info -->
  <text x="110" y="42" fill="#94A3B8" class="font-mono" font-size="12.5" font-weight="500">
    <tspan fill="#38BDF8">root@avian-core</tspan>:<tspan fill="#64748B">~/telemetry/ops</tspan> · <tspan fill="#22C55E">NET_STATUS: SECURE</tspan> · <tspan fill="#94A3B8">PID: 4096</tspan>
  </text>
  
  <!-- Live Radar Graphic in Top Right -->
  <g transform="translate(940, 24)">
    <rect width="225" height="26" rx="6" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="0.8" />
    <circle cx="16" cy="13" r="4" fill="#34D399" class="beacon" />
    <text x="28" y="17" fill="#6EE7B7" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1">RADAR // SOC ENGAGED</text>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(56, 92)">
    
    <!-- System Classification Eyebrow -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="24" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="16" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">
        &gt;&gt; DECLASSIFIED TELEMETRY v5.2
      </text>
    </g>

    <!-- Main Name Title with Dynamic Shimmer -->
    <text x="0" y="74" fill="url(#titleShimmer)" class="font-sans glitch-text" font-size="54" font-weight="900" letter-spacing="-1.2">
      JOVIAN EKASAKTA
    </text>

    <!-- Tagline HUD Banner -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="550" height="32" rx="6" fill="#0B1329" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.7" />
      <text x="16" y="21" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700" letter-spacing="1.2">
        OFFENSIVE SECURITY ⚔️ · SYSTEMS NETWORKING 🌐 · AI 🤖
      </text>
    </g>

    <!-- Punchy Description -->
    <text x="0" y="160" fill="#E2E8F0" class="font-sans" font-size="15" font-weight="500">
      Systems &amp; Network Engineer · CTF Player · Developer Toolchain Builder
    </text>
    
    <text x="0" y="186" fill="#94A3B8" class="font-sans" font-size="13.5" font-weight="400">
      Synthesizing low-level network fabrics (60+ MikroTik labs) with modern offensive security &amp; agentic pipelines.
    </text>

    <!-- Quick Stats Metric Pills -->
    <g transform="translate(0, 215)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="14" fill="#64748B" class="font-mono" font-size="9" font-weight="600">REPOSITORIES</text>
        <text x="12" y="28" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="700">58+ BUILDS</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(142, 0)">
        <rect width="130" height="34" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="14" fill="#64748B" class="font-mono" font-size="9" font-weight="600">ROUTER LABS</text>
        <text x="12" y="28" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700">60+ TOPOLOGIES</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(284, 0)">
        <rect width="130" height="34" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="14" fill="#64748B" class="font-mono" font-size="9" font-weight="600">LKS STANDING</text>
        <text x="12" y="28" fill="#F59E0B" class="font-mono" font-size="13" font-weight="700">#1 CHAMPION</text>
      </g>

      <!-- Metric 4 -->
      <g transform="translate(426, 0)">
        <rect width="130" height="34" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="14" fill="#64748B" class="font-mono" font-size="9" font-weight="600">AI FELLOWSHIP</text>
        <text x="12" y="28" fill="#10B981" class="font-mono" font-size="13" font-weight="700">GOOGLE CLOUD</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CARDS HUD MATRIX -->
  <g transform="translate(680, 86)">
    
    <!-- HUD Card 1: Championship Insignia -->
    <g transform="translate(0, 0)">
      <rect width="464" height="74" rx="10" fill="#090E17" stroke="url(#goldGrad)" stroke-width="1.2" />
      <!-- Left Accent Bar -->
      <rect x="0" y="0" width="5" height="74" rx="2" fill="url(#goldGrad)" />
      
      <!-- Trophy Icon Graphic -->
      <g transform="translate(20, 20)">
        <circle cx="17" cy="17" r="17" fill="#F59E0B" fill-opacity="0.15" />
        <path d="M 10 9 L 24 9 L 24 17 C 24 21 21 24 17 24 C 13 24 10 21 10 17 Z" fill="none" stroke="#F59E0B" stroke-width="2" />
        <path d="M 6 12 C 6 15 10 16 10 16" stroke="#F59E0B" stroke-width="1.8" />
        <path d="M 28 12 C 28 15 24 16 24 16" stroke="#F59E0B" stroke-width="1.8" />
        <path d="M 17 24 L 17 28 M 12 28 L 22 28" stroke="#F59E0B" stroke-width="2" />
      </g>

      <text x="68" y="28" fill="#F59E0B" class="font-mono" font-size="11" font-weight="800" letter-spacing="1.5">
        OFFENSIVE SECURITY CHAMPION
      </text>
      <text x="68" y="48" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">
        #1 LKS Cybersecurity · Cyber Jawara Nominee
      </text>
      <text x="68" y="64" fill="#94A3B8" class="font-mono" font-size="11">
        Web Exploitation, Reverse Engineering &amp; Packet Analysis
      </text>
    </g>

    <!-- HUD Card 2: Google Cloud AI -->
    <g transform="translate(0, 84)">
      <rect width="464" height="74" rx="10" fill="#090E17" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="0" y="0" width="5" height="74" rx="2" fill="#38BDF8" />
      
      <!-- Spark / Neural Node Icon -->
      <g transform="translate(20, 20)">
        <circle cx="17" cy="17" r="17" fill="#38BDF8" fill-opacity="0.15" />
        <path d="M 17 8 L 19 14 L 25 17 L 19 20 L 17 26 L 15 20 L 9 17 L 15 14 Z" fill="#38BDF8" />
      </g>

      <text x="68" y="28" fill="#38BDF8" class="font-mono" font-size="11" font-weight="800" letter-spacing="1.5">
        AI &amp; CLOUD ARCHITECTURES
      </text>
      <text x="68" y="48" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">
        Google Cloud AI Generation Fellow
      </text>
      <text x="68" y="64" fill="#94A3B8" class="font-mono" font-size="11">
        Architecting CLIarity &amp; Autonomous Agent Toolchains
      </text>
    </g>

    <!-- HUD Card 3: Network Infrastructure -->
    <g transform="translate(0, 168)">
      <rect width="464" height="74" rx="10" fill="#090E17" stroke="#22C55E" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="0" y="0" width="5" height="74" rx="2" fill="#22C55E" />
      
      <!-- Network Nodes Graphic -->
      <g transform="translate(20, 20)">
        <circle cx="17" cy="17" r="17" fill="#22C55E" fill-opacity="0.15" />
        <circle cx="11" cy="17" r="3" fill="#22C55E" />
        <circle cx="23" cy="11" r="3" fill="#22C55E" />
        <circle cx="23" cy="23" r="3" fill="#22C55E" />
        <line x1="11" y1="17" x2="23" y2="11" stroke="#22C55E" stroke-width="1.5" />
        <line x1="11" y1="17" x2="23" y2="23" stroke="#22C55E" stroke-width="1.5" />
      </g>

      <text x="68" y="28" fill="#22C55E" class="font-mono" font-size="11" font-weight="800" letter-spacing="1.5">
        HARDWARE &amp; ENTERPRISE NETWORKING
      </text>
      <text x="68" y="48" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="700">
        60+ MikroTik Infrastructure Labs
      </text>
      <text x="68" y="64" fill="#94A3B8" class="font-mono" font-size="11">
        RouterOS v7, Dynamic BGP/OSPF, VLANs &amp; Firewalling
      </text>
    </g>
  </g>

  <!-- Bottom Global Telemetry HUD Footer -->
  <g transform="translate(20, 362)">
    <rect width="1160" height="40" rx="8" fill="#080C14" stroke="#1E293B" stroke-width="1" />
    
    <!-- Signal Indicator -->
    <g transform="translate(24, 12)">
      <rect x="0" y="10" width="3" height="6" rx="1" fill="#38BDF8" />
      <rect x="6" y="7" width="3" height="9" rx="1" fill="#38BDF8" />
      <rect x="12" y="4" width="3" height="12" rx="1" fill="#38BDF8" />
      <rect x="18" y="0" width="3" height="16" rx="1" fill="#38BDF8" />
      <text x="28" y="13" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="700">LINK: 10.0 Gbps / UPTIME: 99.98%</text>
    </g>

    <!-- Central Tech Pill -->
    <text x="440" y="25" fill="#94A3B8" class="font-mono" font-size="11">
      <tspan fill="#38BDF8">KERNEL:</tspan> Debian 12 · Kali Rolling · RouterOS v7.14
    </text>

    <!-- Right Coordinates -->
    <g transform="translate(940, 14)">
      <text x="0" y="11" fill="#64748B" class="font-mono" font-size="10.5">
        <tspan fill="#22C55E">●</tspan> LATENCY: 12ms · INDONESIA / UK
      </text>
    </g>
  </g>

</svg>
