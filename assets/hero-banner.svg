<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
      <circle cx="30" cy="30" r="0.8" fill="#38BDF8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pulse { animation: pulse 2.5s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="358" rx="12" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Top Bar -->
  <rect x="18" y="16" width="1164" height="34" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
  
  <!-- Terminal Window Dots -->
  <circle cx="38" cy="33" r="4.5" fill="#EF4444" fill-opacity="0.8" />
  <circle cx="54" cy="33" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
  <circle cx="70" cy="33" r="4.5" fill="#10B981" fill-opacity="0.8" />

  <!-- Shell Path -->
  <text x="96" y="37" fill="#64748B" class="font-mono" font-size="12" font-weight="500">
    jovian@node-01:<tspan fill="#38BDF8">~/systems/core</tspan> (main)
  </text>

  <!-- Live Status Badge -->
  <g transform="translate(985, 23)">
    <rect width="185" height="20" rx="4" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
    <circle cx="12" cy="10" r="3.5" fill="#34D399" class="pulse" />
    <text x="24" y="14" fill="#6EE7B7" class="font-mono" font-size="10" font-weight="700" letter-spacing="0.5">TELEMETRY // ACTIVE</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(54, 86)">
    <!-- Sub-header Tag -->
    <text x="0" y="18" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5">
      // PROTOCOL: RESEARCH &amp; INFRASTRUCTURE
    </text>

    <!-- Main Title -->
    <text x="0" y="68" fill="url(#textGrad)" class="font-sans" font-size="46" font-weight="800" letter-spacing="-0.8">
      JOVIAN EKASAKTA
    </text>

    <!-- Discipline Pill -->
    <g transform="translate(0, 88)">
      <rect width="460" height="26" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="17" fill="#94A3B8" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.8">
        OFFENSIVE SECURITY · NETWORKING · AI TOOLCHAINS
      </text>
    </g>

    <!-- Bio Description -->
    <text x="0" y="152" fill="#94A3B8" class="font-sans" font-size="14" font-weight="400">
      Network systems specialist and cybersecurity researcher.
    </text>
    <text x="0" y="174" fill="#64748B" class="font-sans" font-size="13.5" font-weight="400">
      Engineering resilient network fabrics, CTF exploit automation, and agent architectures.
    </text>
  </g>

  <!-- Right Cards Column -->
  <g transform="translate(710, 80)">
    <!-- Card 1: LKS Champion -->
    <g transform="translate(0, 0)">
      <rect width="436" height="52" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="3" height="52" rx="1.5" fill="#38BDF8" />
      <text x="18" y="22" fill="#38BDF8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">HONORS</text>
      <text x="18" y="41" fill="#F1F5F9" class="font-sans" font-size="13.5" font-weight="600">#1 LKS Cybersecurity · Cyber Jawara Nominee</text>
      <text x="410" y="32" fill="#334155" class="font-mono" font-size="12">01</text>
    </g>

    <!-- Card 2: Google AI -->
    <g transform="translate(0, 62)">
      <rect width="436" height="52" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="3" height="52" rx="1.5" fill="#10B981" />
      <text x="18" y="22" fill="#10B981" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">FELLOWSHIP</text>
      <text x="18" y="41" fill="#F1F5F9" class="font-sans" font-size="13.5" font-weight="600">Google Cloud AI Generation Fellow</text>
      <text x="410" y="32" fill="#334155" class="font-mono" font-size="12">02</text>
    </g>

    <!-- Card 3: Network Labs -->
    <g transform="translate(0, 124)">
      <rect width="436" height="52" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="3" height="52" rx="1.5" fill="#818CF8" />
      <text x="18" y="22" fill="#818CF8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">INFRASTRUCTURE</text>
      <text x="18" y="41" fill="#F1F5F9" class="font-sans" font-size="13.5" font-weight="600">60+ MikroTik Labs · Routing, Switching &amp; Firewalls</text>
      <text x="410" y="32" fill="#334155" class="font-mono" font-size="12">03</text>
    </g>
  </g>

  <!-- Bottom Info Strip -->
  <g transform="translate(54, 302)">
    <rect width="1092" height="32" rx="6" fill="#0B111E" stroke="#1E293B" stroke-width="1" />
    
    <text x="20" y="20" fill="#64748B" class="font-mono" font-size="11">
      <tspan fill="#38BDF8">SITE:</tspan> jovian.my.id
    </text>
    <text x="250" y="20" fill="#64748B" class="font-mono" font-size="11">
      <tspan fill="#38BDF8">STACK:</tspan> Debian / Kali / RouterOS v7
    </text>
    <text x="560" y="20" fill="#64748B" class="font-mono" font-size="11">
      <tspan fill="#38BDF8">LOC:</tspan> Indonesia / UK
    </text>
    <text x="830" y="20" fill="#64748B" class="font-mono" font-size="11">
      <tspan fill="#10B981">●</tspan> OPEN FOR COLLABORATION
    </text>
  </g>
</svg>
