<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#22C55E" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>

  <!-- Base Outer Container -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="180" r="120" fill="#0284C7" fill-opacity="0.12" filter="url(#glowEffect)" />
  <circle cx="1050" cy="160" r="130" fill="#10B981" fill-opacity="0.10" filter="url(#glowEffect)" />
  <circle cx="600" cy="200" r="100" fill="#6366F1" fill-opacity="0.08" filter="url(#glowEffect)" />

  <!-- Outer Cyber Border -->
  <rect x="2" y="2" width="1196" height="376" rx="16" stroke="url(#cyberBorder)" stroke-width="1.5" />

  <!-- Corner Tech Accents -->
  <path d="M 12 36 L 12 12 L 36 12" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1188 36 L 1188 12 L 1164 12" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 12 344 L 12 368 L 36 368" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1188 344 L 1188 368 L 1164 368" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Terminal Header Bar -->
  <rect x="20" y="18" width="1160" height="38" rx="8" fill="#0F172A" fill-opacity="0.75" stroke="#334155" stroke-width="0.8" />
  
  <!-- Terminal Window Controls -->
  <circle cx="42" cy="37" r="5.5" fill="#EF4444" />
  <circle cx="60" cy="37" r="5.5" fill="#F59E0B" />
  <circle cx="78" cy="37" r="5.5" fill="#10B981" />

  <!-- Terminal Session Info -->
  <text x="110" y="42" fill="#94A3B8" class="font-mono" font-size="13" font-weight="500">jovian@netsec-core:~/env/production</text>
  
  <!-- Status Chip (Right aligned inside header bar) -->
  <g transform="translate(940, 27)">
    <rect width="225" height="20" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="0.8" />
    <circle cx="14" cy="10" r="4" fill="#34D399" class="pulse-dot" />
    <text x="26" y="14" fill="#6EE7B7" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="0.8">SYSTEMS OPERATIONAL // LIVE</text>
  </g>

  <!-- Left Hero Decorative Terminal Frame -->
  <g transform="translate(60, 95)">
    <!-- Terminal Identifier Prompt -->
    <text x="0" y="24" fill="#38BDF8" class="font-mono" font-size="14" font-weight="700" letter-spacing="1.5">&gt; ROOT@VIAN-SYSTEMS // PROTOCOL v4.8</text>
    
    <!-- Main Title -->
    <text x="0" y="80" fill="url(#titleGrad)" class="font-sans" font-size="52" font-weight="900" letter-spacing="-0.5">JOVIAN EKASAKTA</text>
    
    <!-- Role Subtitle with Glowing Accent -->
    <g transform="translate(0, 115)">
      <rect x="0" y="-18" width="530" height="28" rx="6" fill="#0284C7" fill-opacity="0.12" stroke="#38BDF8" stroke-width="0.8" />
      <text x="14" y="1" fill="url(#subGrad)" class="font-mono" font-size="13.5" font-weight="700" letter-spacing="1.2">CYBERSECURITY · AI SYSTEMS · NETWORKING</text>
    </g>

    <!-- Bio / Mission statement line -->
    <text x="0" y="160" fill="#94A3B8" class="font-sans" font-size="15" font-weight="400">
      TKJ Engineer &amp; Security Researcher at SMK Dwija Bhakti 01 Jombang.
    </text>
    <text x="0" y="184" fill="#64748B" class="font-sans" font-size="14" font-weight="400">
      Studying in Google Cloud AI Generation · Crafting autonomous agent toolchains &amp; defensive architectures.
    </text>
  </g>

  <!-- Right Side Interactive Telemetry Matrix Cards -->
  <g transform="translate(740, 92)">
    <!-- Card 1: Cybersecurity Champion -->
    <g transform="translate(0, 0)">
      <rect width="400" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#EF4444" />
      <text x="20" y="24" fill="#F87171" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">CHAMPIONSHIP</text>
      <text x="20" y="42" fill="#F1F5F9" class="font-sans" font-size="14" font-weight="600">#1 LKS Cybersecurity · Cyber Jawara Nominee</text>
      <!-- Mini Shield Icon -->
      <path d="M 368 20 L 378 16 L 388 20 C 388 28 378 34 378 34 C 378 34 368 28 368 20 Z" fill="none" stroke="#EF4444" stroke-width="1.5" />
    </g>

    <!-- Card 2: Google AI Generation -->
    <g transform="translate(0, 62)">
      <rect width="400" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#38BDF8" />
      <text x="20" y="24" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">AI &amp; CLOUD RESEARCH</text>
      <text x="20" y="42" fill="#F1F5F9" class="font-sans" font-size="14" font-weight="600">Google Cloud AI Generation · #TEAMGOOGLE</text>
      <!-- Sparkle Icon -->
      <path d="M 378 18 L 380 23 L 385 25 L 380 27 L 378 32 L 376 27 L 371 25 L 376 23 Z" fill="#38BDF8" />
    </g>

    <!-- Card 3: Network Systems & Labs -->
    <g transform="translate(0, 124)">
      <rect width="400" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#22C55E" />
      <text x="20" y="24" fill="#22C55E" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">INFRASTRUCTURE</text>
      <text x="20" y="42" fill="#F1F5F9" class="font-sans" font-size="14" font-weight="600">60+ MikroTik Labs · Routing, VLANs &amp; Systems</text>
      <!-- Network Nodes Icon -->
      <circle cx="372" cy="23" r="3" fill="#22C55E" />
      <circle cx="384" cy="23" r="3" fill="#22C55E" />
      <circle cx="378" cy="31" r="3" fill="#22C55E" />
      <line x1="372" y1="23" x2="384" y2="23" stroke="#22C55E" stroke-width="1" />
      <line x1="372" y1="23" x2="378" y2="31" stroke="#22C55E" stroke-width="1" />
      <line x1="384" y1="23" x2="378" y2="31" stroke="#22C55E" stroke-width="1" />
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 320)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="18" fill="#94A3B8" class="font-mono" font-size="11">🌐 jovian.my.id</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="28" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="189" y="18" fill="#94A3B8" class="font-mono" font-size="11">💻 58+ Repositories</text>

    <!-- Pill 3 -->
    <rect x="355" y="0" width="165" height="28" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="369" y="18" fill="#94A3B8" class="font-mono" font-size="11">📍 Indonesia / UK</text>

    <!-- Pill 4 -->
    <rect x="535" y="0" width="190" height="28" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="549" y="18" fill="#94A3B8" class="font-mono" font-size="11">⚡ Red Teaming &amp; AI Agents</text>
  </g>

</svg>
