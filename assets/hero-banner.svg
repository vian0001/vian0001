<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#388BFD" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#21262D" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Dot Matrix -->
    <pattern id="subtleGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.6" fill="#30363D" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'Geist Mono', 'SF Mono', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Geist', 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="1198" height="278" rx="8" fill="url(#bgCanvas)" stroke="#30363D" stroke-width="1" />
  <rect x="1" y="1" width="1198" height="278" rx="8" fill="url(#subtleGrid)" />

  <!-- Top Accent Hairline -->
  <rect x="1" y="1" width="1198" height="2" fill="url(#accentLine)" />

  <!-- Top Meta Bar -->
  <g transform="translate(48, 42)">
    <circle cx="4" cy="4" r="3" fill="#238636" />
    <text x="16" y="8" fill="#7D8590" class="font-mono" font-size="11" letter-spacing="0.08em">SYSTEMS · OFFENSIVE SECURITY · DEVELOPER TOOLING</text>
    <text x="1000" y="8" fill="#7D8590" class="font-mono" font-size="11">INDONESIA / UK</text>
  </g>

  <line x1="48" y1="62" x2="1152" y2="62" stroke="#21262D" stroke-width="1" />

  <!-- Main Headline -->
  <g transform="translate(48, 124)">
    <text x="0" y="0" fill="#F0F6FC" class="font-sans" font-size="44" font-weight="700" letter-spacing="-0.03em">
      Jovian Ekasakta
    </text>
    
    <text x="0" y="32" fill="#8B949E" class="font-sans" font-size="16" font-weight="400" letter-spacing="-0.01em">
      Specializing in low-level network systems, offensive CTF research, and autonomous developer tools.
    </text>
  </g>

  <line x1="48" y1="190" x2="1152" y2="190" stroke="#21262D" stroke-width="1" />

  <!-- Bottom Metric Strip (Restrained, Editorial) -->
  <g transform="translate(48, 228)" class="font-mono" font-size="12">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#58A6FF">01</text>
      <text x="24" y="0" fill="#C9D1D9">#1 LKS Cybersecurity Champion</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(320, 0)">
      <text x="0" y="0" fill="#58A6FF">02</text>
      <text x="24" y="0" fill="#C9D1D9">Google Cloud AI Generation Fellow</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(680, 0)">
      <text x="0" y="0" fill="#58A6FF">03</text>
      <text x="24" y="0" fill="#C9D1D9">60+ MikroTik Infrastructure Labs</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(1000, 0)">
      <text x="0" y="0" fill="#58A6FF">04</text>
      <text x="24" y="0" fill="#C9D1D9">58+ Repositories</text>
    </g>
  </g>
</svg>
