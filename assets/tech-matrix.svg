<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Card Top Glows -->
    <linearGradient id="cardGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGlow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cardGlow4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.8" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes ledPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .led-1 { animation: ledPulse 1.8s infinite ease-in-out; }
    .led-2 { animation: ledPulse 2.3s infinite ease-in-out; }
    .led-3 { animation: ledPulse 1.5s infinite ease-in-out; }
    .led-4 { animation: ledPulse 2.0s infinite ease-in-out; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="url(#matrixBg)" stroke="#1E293B" stroke-width="1.2" />
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="url(#dotGrid)" />

  <!-- Top Title Header Bar -->
  <g transform="translate(30, 20)">
    <text x="0" y="16" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700" letter-spacing="2">
      // SYSTEM ARSENAL &amp; DECLASSIFIED CAPABILITIES MATRIX
    </text>
    <text x="880" y="16" fill="#64748B" class="font-mono" font-size="11">
      MODULES: 4/4 LOADED · INTEGRITY: 100%
    </text>
  </g>
  <line x1="30" y1="46" x2="1170" y2="46" stroke="url(#cyanLine)" stroke-width="1" />

  <!-- 4 COLUMN BENTO MODULES -->

  <!-- MODULE 1: NETWORKING -->
  <g transform="translate(30, 64)">
    <rect width="265" height="270" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="265" height="3" rx="1.5" fill="url(#cardGlow1)" />
    
    <!-- Module Header -->
    <g transform="translate(16, 22)">
      <circle cx="6" cy="6" r="4" fill="#22C55E" class="led-1" />
      <text x="18" y="10" fill="#22C55E" class="font-mono" font-size="11" font-weight="800" letter-spacing="1">
        01 // NET_INFRA
      </text>
      <text x="180" y="10" fill="#64748B" class="font-mono" font-size="10">98% CAP</text>
    </g>
    
    <line x1="16" y1="46" x2="249" y2="46" stroke="#1E293B" stroke-width="1" />

    <!-- Items -->
    <g transform="translate(16, 68)" class="font-mono" font-size="11.5" fill="#E2E8F0">
      <text x="0" y="0"><tspan fill="#38BDF8">›</tspan> MikroTik RouterOS v7</text>
      <text x="0" y="26"><tspan fill="#38BDF8">›</tspan> OSPF / BGP Dynamic Mesh</text>
      <text x="0" y="52"><tspan fill="#38BDF8">›</tspan> 802.1Q VLANs &amp; QinQ</text>
      <text x="0" y="78"><tspan fill="#38BDF8">›</tspan> WireGuard / IPSec Tunnels</text>
      <text x="0" y="104"><tspan fill="#38BDF8">›</tspan> Firewall &amp; NAT Filters</text>
      <text x="0" y="130"><tspan fill="#38BDF8">›</tspan> Wireshark Packet Telemetry</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(16, 236)">
      <rect width="233" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
      <text x="8" y="13" fill="#94A3B8" class="font-mono" font-size="9.5">60+ LAB TOPOLOGIES BUILT</text>
    </g>
  </g>

  <!-- MODULE 2: OFFENSIVE SEC -->
  <g transform="translate(315, 64)">
    <rect width="265" height="270" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="265" height="3" rx="1.5" fill="url(#cardGlow2)" />
    
    <!-- Module Header -->
    <g transform="translate(16, 22)">
      <circle cx="6" cy="6" r="4" fill="#EF4444" class="led-2" />
      <text x="18" y="10" fill="#F87171" class="font-mono" font-size="11" font-weight="800" letter-spacing="1">
        02 // OFF_SEC_OPS
      </text>
      <text x="180" y="10" fill="#64748B" class="font-mono" font-size="10">#1 LKS</text>
    </g>
    
    <line x1="16" y1="46" x2="249" y2="46" stroke="#1E293B" stroke-width="1" />

    <!-- Items -->
    <g transform="translate(16, 68)" class="font-mono" font-size="11.5" fill="#E2E8F0">
      <text x="0" y="0"><tspan fill="#EF4444">›</tspan> Web Exploitation (OWASP)</text>
      <text x="0" y="26"><tspan fill="#EF4444">›</tspan> Burp Suite Pro &amp; Nmap</text>
      <text x="0" y="52"><tspan fill="#EF4444">›</tspan> CTF Payload Automation</text>
      <text x="0" y="78"><tspan fill="#EF4444">›</tspan> Ghidra &amp; Reverse Eng</text>
      <text x="0" y="104"><tspan fill="#EF4444">›</tspan> Privilege Escalation</text>
      <text x="0" y="130"><tspan fill="#EF4444">›</tspan> Kali Linux &amp; Metasploit</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(16, 236)">
      <rect width="233" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
      <text x="8" y="13" fill="#F87171" class="font-mono" font-size="9.5">CYBER JAWARA NOMINEE</text>
    </g>
  </g>

  <!-- MODULE 3: AI & AGENTS -->
  <g transform="translate(600, 64)">
    <rect width="265" height="270" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="265" height="3" rx="1.5" fill="url(#cardGlow3)" />
    
    <!-- Module Header -->
    <g transform="translate(16, 22)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8" class="led-3" />
      <text x="18" y="10" fill="#38BDF8" class="font-mono" font-size="11" font-weight="800" letter-spacing="1">
