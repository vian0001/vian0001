      <text x="195" y="10" fill="#64748B" class="font-mono" font-size="10">58+ REPOS</text>
    </g>
    
    <line x1="16" y1="46" x2="269" y2="46" stroke="#1E293B" stroke-width="1" />

    <!-- Items -->
    <g transform="translate(16, 68)" class="font-mono" font-size="11.5" fill="#E2E8F0">
      <text x="0" y="0"><tspan fill="#F59E0B">›</tspan> Python 3.12 / AsyncIO</text>
      <text x="0" y="26"><tspan fill="#F59E0B">›</tspan> Bash / Linux Shell Scripting</text>
      <text x="0" y="52"><tspan fill="#F59E0B">›</tspan> TypeScript &amp; Next.js 15</text>
      <text x="0" y="78"><tspan fill="#F59E0B">›</tspan> React 19 &amp; Tailwind CSS</text>
      <text x="0" y="104"><tspan fill="#F59E0B">›</tspan> Docker &amp; CI/CD Actions</text>
      <text x="0" y="130"><tspan fill="#F59E0B">›</tspan> Vercel &amp; Supabase Cloud</text>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(16, 236)">
      <rect width="253" height="18" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
      <text x="8" y="13" fill="#FBBF24" class="font-mono" font-size="9.5">FULL-STACK &amp; AUTOMATION</text>
    </g>
  </g>

</svg>
