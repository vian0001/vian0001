  <!-- MODULE 4: DEV & RUNTIMES -->
  <g transform="translate(885, 64)">
    <rect width="285" height="270" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="285" height="3" rx="1.5" fill="url(#cardGlow4)" />
    
    <!-- Module Header -->
    <g transform="translate(16, 22)">
      <circle cx="6" cy="6" r="4" fill="#F59E0B" class="led-4" />
      <text x="18" y="10" fill="#FBBF24" class="font-mono" font-size="11" font-weight="800" letter-spacing="1">
        04 // RUNTIMES_&amp;_DEV
